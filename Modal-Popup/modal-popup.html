<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Modal-Popup</title>
</head>
<body>

   <button id="open-modal">
      Abrir Modal
   </button>

    <div class="modal" id="modal">

        <div class="modal-content">

          <span id="close-modal">
           X
          </span>

          <h2>Login</h2>

          <input 
          type="text"
          placeholder="Usuario"
          >

          <input 
          type="password"
          placeholder="Senha"
          >

          <di class="buttons">
            <button id="login-btn">
                Entrar
            </button>

            <button id="cancel-btn">
                Cancelar
            </button>


          </div>
          

        </div>

    </div>

    <script src="modal-popup.js"></script>




    
</body>
</html>
